name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # upload-rust-binary-action uploads assets to an existing release; create it
  # first so tag pushes work unattended.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          # No Windows: the terminal layer is termios and poll(2).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: sv
          target: ${{ matrix.target }}
          archive: sv-$tag-${{ matrix.target }}
          include: completions
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: refs/tags/${{ github.ref_name }}
          features: ""
      - name: Mark as pre-release
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --prerelease

  bump-homebrew-tap:
    needs: upload-assets
    runs-on: ubuntu-latest
    env:
      TAP_REPO: svartal-cli/homebrew-tap
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Skip when tap token is not configured
        if: env.TAP_TOKEN == ''
        run: |
          echo "::notice::HOMEBREW_TAP_TOKEN is not configured; skipping Homebrew tap PR."

      - uses: actions/checkout@v4
        if: env.TAP_TOKEN != ''

      - name: Download release checksums
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.sha256" \
            --dir shas

      - name: Open tap formula bump PR
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.TAP_TOKEN }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          branch="bump-sv-${version}-${GITHUB_RUN_ID}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git" tap
          cd tap
          git switch -c "${branch}"

          python3 ../scripts/update_homebrew_formula.py Formula/sv.rb "${version}" ../shas

          if git diff --quiet; then
            echo "::notice::Homebrew formula already points at ${version}."
            exit 0
          fi

          git config user.name "sv-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add Formula/sv.rb
          git commit -m "sv ${version}"
          git push -u origin "${branch}"
          gh pr create \
            --repo "${TAP_REPO}" \
            --title "sv ${version}" \
            --body "Automated formula bump for sv ${version}." \
            --head "${branch}" \
            --base main
